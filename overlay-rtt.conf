# Optional: free uart20 - printk/boot on RTT; shell + LOG stay on USB CDC0.
# Use with boards/nrf54lm20dk_nrf54lm20b_cpuapp_rtt.overlay (see just build-rtt).

CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# Do not block boot if no RTT Viewer is attached (default mode is skip).
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y
# Avoid sleep/retry delays when the RTT host is absent.
CONFIG_RTT_TX_RETRY_CNT=0

# Keep printk on RTT; application LOG continues via shell backend on CDC0.
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_PRINTK=n