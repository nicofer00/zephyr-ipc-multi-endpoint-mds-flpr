sample:
  name: IPC multi-endpoint MDS + FLPR
common:
  sysbuild: true
  extra_args: multi_endpoint_SNIPPET="nordic-flpr;mds-flpr"
  tags: ipc bluetooth mcuboot mcumgr
tests:
  sample.ipc.multi_endpoint.mds_flpr.nrf54lm20b:
    platform_allow:
      - nrf54lm20dk/nrf54lm20b/cpuapp
    integration_platforms:
      - nrf54lm20dk/nrf54lm20b/cpuapp
    harness: console
    harness_config:
      type: multi_line
      ordered: false
      regex:
        - "Starting Bluetooth Memfault sample with FLPR IPC"
        - "APP version:"
        - "Bluetooth initialized"
        - "Advertising successfully started"
    timeout: 60

  sample.ipc.multi_endpoint.mds_flpr.nrf54lm20b.build:
    platform_allow:
      - nrf54lm20dk/nrf54lm20b/cpuapp
    integration_platforms:
      - nrf54lm20dk/nrf54lm20b/cpuapp
    build_only: true
    timeout: 600

  sample.ipc.multi_endpoint.mds_flpr.nrf54lm20b.ota_ble:
    platform_allow:
      - nrf54lm20dk/nrf54lm20b/cpuapp
    integration_platforms:
      - nrf54lm20dk/nrf54lm20b/cpuapp
    harness: pytest
    harness_config:
      fixture: usb_hci
      pytest_root:
        - "pytest/test_ota_ble.py"
    slow: true
    timeout: 600
