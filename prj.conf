CONFIG_NCS_SAMPLES_DEFAULTS=y

CONFIG_PRINTK=y

CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y
CONFIG_IPC_SERVICE_LOG_LEVEL_INF=y

CONFIG_BT=y
# BT shell for bt advertise / id-show / etc. Connection dumps used to wedge CDC0
# shell (IRQ TXDONE wait forever). Mitigations below: blocking shell TX + CDC WQ.
CONFIG_BT_SHELL=y
CONFIG_BT_SMP=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="Nordic_Memfault"
CONFIG_BT_PRIVACY=y
# Advertise with identity address (see BT_LE_ADV_OPT_USE_IDENTITY in main.c) so
# scanners see a stable MAC; privacy IRK still used once bonded.
# Allow Windows/bleak to re-pair over an existing Just Works bond (repair after
# remove-on-host or stale LTK) without requiring bt clear all on the DK.
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
# Windows/iOS Just Works bonding (no display/keyboard). MITM enforcement rejects
# that pairing so bonds do not stick and phones treat each connect as a new device.
CONFIG_BT_SMP_ENFORCE_MITM=n

CONFIG_BT_BAS=y
CONFIG_BT_MDS=y

CONFIG_BT_CTLR_PHY_2M=y
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_CTLR_DATA_LENGTH_MAX=251

CONFIG_LOG=y
CONFIG_LOG_PRINTK=n
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_MODE_OVERFLOW=y
CONFIG_LOG_BACKEND_RTT=n

CONFIG_SHELL=y
CONFIG_SENSOR_SHELL=n
CONFIG_DK_LIBRARY=y
# Keep bt_shell usable on CDC0: blocking TX avoids forever wait on UART IRQ
# TXDONE when BT conn callbacks print Connected/LMP/Features into the shell.
CONFIG_SHELL_BACKEND_SERIAL_FORCE_TX_BLOCKING_MODE=y
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=256

CONFIG_HEAP_MEM_POOL_SIZE=8192

CONFIG_MEMFAULT=y
CONFIG_MEMFAULT_SHELL=y
CONFIG_MEMFAULT_LOGGING_ENABLE=y
CONFIG_MEMFAULT_LOG_LEVEL_INF=y

CONFIG_MEMFAULT_NCS_PROJECT_KEY="PRDDdY3Idi9MqFBLK1U11AyuNoZoaqPj"
CONFIG_MEMFAULT_NCS_DEVICE_ID_STATIC=y
CONFIG_MEMFAULT_NCS_DEVICE_ID="nrf-ble-testdevice"
# Firmware version comes from the sample VERSION file (APP_VERSION_TWEAK_STRING).
CONFIG_MEMFAULT_NCS_FW_VERSION_STATIC=y
CONFIG_MEMFAULT_NCS_BT_METRICS=y
CONFIG_MEMFAULT_MCUMGR_GRP=y

CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
# nRF54L Series: use ZMS (not NVS) as the Settings backend for bonding/CCCs.
CONFIG_ZMS=y
CONFIG_SETTINGS_ZMS=y

# SPI00 MX25R64 for spiflash CLI (OTA secondary remains on internal RRAM)
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_SPI_NOR=y
CONFIG_SPI_NOR_FLASH_LAYOUT_PAGE_SIZE=4096
CONFIG_NORDIC_QSPI_NOR=n

# BLE + UART MCUmgr OTA (same coupled app_update.bin).
# UART SMP is on USB CDC2 only; CDC1 stays FLPR logs.
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU=y
CONFIG_NCS_SAMPLE_MCUMGR_BT_OTA_DFU_SPEEDUP=y
CONFIG_MCUMGR_GRP_ZBASIC_STORAGE_ERASE=n
# CONFIG_MCUBOOT_IMGTOOL_SIGN_VERSION defaults to APP_VERSION_TWEAK_STRING from VERSION.
CONFIG_UART_MCUMGR=y
CONFIG_MCUMGR_TRANSPORT_UART=y
# Larger UART SMP frames + more line buffers so USB CDC DFU does not stall when
# the host fills NETBUF-sized chunks (default RX was 128*2).
CONFIG_MCUMGR_TRANSPORT_UART_MTU=1024
CONFIG_UART_MCUMGR_RX_BUF_SIZE=128
CONFIG_UART_MCUMGR_RX_BUF_COUNT=16
CONFIG_BASE64=y

# Triple CDC ACM (USB device on cpuapp). Stock CDC_ACM_SERIAL_* boot helper
# is off — src/usb_cdc_triple.c registers CDC0/1/2 explicitly.
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
# Dedicated CDC workqueue so shell/BT prints do not deadlock the USB path.
CONFIG_USBD_CDC_ACM_WORKQUEUE=y
CONFIG_USBD_CDC_ACM_STACK_SIZE=2048
# Host control transfers can request up to ~4 KiB (seen as udc alloc 4095 on ep 0x80).
# Three CDCs need more outstanding request buffers than dual-CDC defaults.
CONFIG_UDC_BUF_POOL_SIZE=12288
CONFIG_UDC_BUF_COUNT=48
