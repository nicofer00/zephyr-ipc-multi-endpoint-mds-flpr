# Optional: free uart30 - FLPR printk/boot on RTT.
# Operational logs still go over IPC to cpuapp CDC1 (flpr_log_backend).

CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n

# Do not block FLPR boot if no RTT Viewer is attached.
CONFIG_SEGGER_RTT_MODE_NO_BLOCK_SKIP=y
CONFIG_RTT_TX_RETRY_CNT=0

# Keep printk on RTT_CONSOLE; do not enable blocking LOG RTT backend.
CONFIG_LOG_BACKEND_RTT=n
CONFIG_LOG_PRINTK=n